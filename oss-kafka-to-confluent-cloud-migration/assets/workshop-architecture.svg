<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b4fb0"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c8862a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">
    OSS Apache Kafka on EC2 → Confluent Cloud Enterprise, over AWS PrivateLink
  </text>

  <!-- AWS VPC -->
  <rect x="20" y="60" width="560" height="470" rx="12" fill="#f5f7fb" stroke="#9bb0d3" stroke-width="2"/>
  <text x="40" y="84" font-size="15" font-weight="bold" fill="#3a5b9a">AWS VPC (your account)</text>

  <!-- Public subnet / bastion -->
  <rect x="40" y="100" width="250" height="300" rx="10" fill="#ffffff" stroke="#9bb0d3" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="56" y="120" font-size="12" fill="#3a5b9a">Public subnet</text>
  <rect x="55" y="130" width="220" height="258" rx="8" fill="#fbfcfe" stroke="#555" stroke-width="1.5"/>
  <text x="165" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Bastion (EC2)</text>

  <rect x="70" y="165" width="190" height="50" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="165" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">KCP · Vault · Terraform</text>
  <text x="165" y="204" text-anchor="middle" font-size="10" fill="#555">discover · provision · cut over</text>

  <rect x="70" y="235" width="190" height="50" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="165" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Producer / Consumer</text>
  <text x="165" y="274" text-anchor="middle" font-size="10" fill="#555">SCRAM-SHA-512</text>

  <rect x="70" y="310" width="190" height="62" rx="6" fill="#eef6ee" stroke="#3c7a3c" stroke-width="1.5"/>
  <text x="165" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Confluent Gateway</text>
  <text x="165" y="348" text-anchor="middle" font-size="10" fill="#555">k3s + CFK · localhost:9595</text>
  <text x="165" y="363" text-anchor="middle" font-size="10" fill="#555">passthrough → switchover</text>

  <!-- Private subnet / broker -->
  <rect x="310" y="100" width="250" height="300" rx="10" fill="#ffffff" stroke="#9bb0d3" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="326" y="120" font-size="12" fill="#3a5b9a">Private subnet (no public IPs)</text>

  <rect x="325" y="135" width="220" height="86" rx="8" fill="#fff5e6" stroke="#c8862a" stroke-width="1.5"/>
  <text x="435" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">OSS Apache Kafka (EC2)</text>
  <text x="435" y="176" text-anchor="middle" font-size="10" fill="#555">KRaft · SASL_SSL · workshop CA</text>
  <text x="435" y="192" text-anchor="middle" font-size="10" fill="#555">kafka.oss-workshop.internal:9092</text>
  <text x="435" y="208" text-anchor="middle" font-size="10" fill="#555">Jolokia (read-only) :8778</text>

  <rect x="325" y="300" width="220" height="70" rx="8" fill="#ffffff" stroke="#c8862a" stroke-width="1.5"/>
  <text x="435" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Internal NLB + endpoint service</text>
  <text x="435" y="342" text-anchor="middle" font-size="10" fill="#555">kcp create-asset migration-infra</text>
  <text x="435" y="357" text-anchor="middle" font-size="10" fill="#555">(external outbound, type 2)</text>

  <!-- Ingress PrivateLink endpoint -->
  <rect x="40" y="420" width="250" height="90" rx="10" fill="#ffffff" stroke="#3b4fb0" stroke-width="1.5"/>
  <text x="165" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">PrivateLink endpoint (ingress)</text>
  <text x="165" y="464" text-anchor="middle" font-size="10" fill="#555">+ private DNS for the cluster</text>
  <text x="165" y="482" text-anchor="middle" font-size="10" fill="#555">kcp create-asset target-infra</text>

  <!-- Confluent Cloud -->
  <rect x="640" y="100" width="300" height="410" rx="12" fill="#eef1fb" stroke="#3b4fb0" stroke-width="2"/>
  <text x="790" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#3b4fb0">Confluent Cloud</text>

  <rect x="665" y="150" width="250" height="70" rx="8" fill="#ffffff" stroke="#3b4fb0" stroke-width="1.5"/>
  <text x="790" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Enterprise cluster</text>
  <text x="790" y="197" text-anchor="middle" font-size="10" fill="#555">private networking · mirror topics</text>

  <rect x="665" y="250" width="250" height="50" rx="8" fill="#ffffff" stroke="#3b4fb0" stroke-width="1.5"/>
  <text x="790" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Cluster link (pulls, syncs offsets)</text>

  <rect x="665" y="330" width="250" height="60" rx="8" fill="#ffffff" stroke="#3b4fb0" stroke-width="1.5"/>
  <text x="790" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Egress PrivateLink access point</text>
  <text x="790" y="372" text-anchor="middle" font-size="10" fill="#555">+ DNS for kafka.oss-workshop.internal</text>

  <!-- Arrows -->
  <!-- producer/consumer -> gateway -->
  <line x1="165" y1="285" x2="165" y2="308" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- gateway -> kafka (before cutover) -->
  <path d="M260,335 C295,335 295,200 323,195" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="318" y="240" font-size="10" fill="#444">before cutover</text>
  <!-- KCP -> kafka (scan + metrics) -->
  <line x1="260" y1="182" x2="323" y2="168" stroke="#777" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <!-- gateway -> ingress endpoint (after cutover) -->
  <line x1="165" y1="372" x2="165" y2="418" stroke="#3b4fb0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <text x="172" y="400" font-size="10" fill="#3b4fb0">after cutover</text>
  <!-- ingress endpoint -> enterprise cluster -->
  <path d="M290,470 L600,470 Q612,470 612,458 L612,202 Q612,190 624,190 L663,190" fill="none" stroke="#3b4fb0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <!-- enterprise cluster -> cluster link -->
  <line x1="790" y1="220" x2="790" y2="248" stroke="#3b4fb0" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <!-- cluster link -> egress access point -->
  <line x1="790" y1="300" x2="790" y2="328" stroke="#c8862a" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <!-- egress access point -> NLB -->
  <line x1="665" y1="360" x2="547" y2="338" stroke="#c8862a" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="606" y="340" text-anchor="middle" font-size="10" fill="#c8862a">PrivateLink</text>
  <!-- NLB -> kafka -->
  <line x1="435" y1="300" x2="435" y2="223" stroke="#c8862a" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="442" y="266" font-size="10" fill="#c8862a">link pulls :9092 (SASL_SSL)</text>

  <!-- Laptop note -->
  <text x="20" y="562" font-size="12" fill="#333"><tspan font-weight="bold">Your laptop:</tspan> terraform apply creates the VPC, NAT gateway, broker, bastion, private DNS zone and workshop CA.</text>
  <text x="20" y="582" font-size="12" fill="#333"><tspan font-weight="bold">Your browser:</tspan> EC2 Instance Connect to the bastion. Nothing in the VPC is reachable from the internet.</text>
</svg>
