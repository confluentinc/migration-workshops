# KCP credentials file for the workshop's source cluster (Apache Kafka on EC2).
#
# `kcp discover` only understands Amazon MSK (it walks the MSK APIs), so a self-managed
# cluster is described here and discovered through the Kafka Admin API instead:
#   kcp scan clusters --source-type apache-kafka --credentials-file kcp/apache-kafka-credentials.yaml ...
#
# `id` becomes the cluster key in kcp-state.json and the --cluster-id for later
# `kcp create-asset` commands. Run kcp from the workshop root: ca_cert is relative to it.
clusters:
  - id: oss-kafka
    bootstrap_servers:
      - kafka.oss-workshop.internal:9092
    auth_method:
      sasl_scram:
        use: true
        username: orders-app
        password: ChangeMe123!
        mechanism: SHA512
        # The workshop CA that signed the broker's certificate; KCP verifies against it.
        ca_cert: ca.pem
    jolokia:
      endpoints:
        - http://kafka.oss-workshop.internal:8778/jolokia
    metadata:
      environment: workshop
      location: aws-ec2
