# Gateway init state for KCP migration - applied in STEP-2
# Two streaming domains (OSS Kafka + Confluent Cloud), two routes:
#   - migration-route (9595): passthrough to OSS Kafka (client traffic)
#   - scram-registration-route (9599): swap to CC (SCRAM user registration)
#
# At cutover, `kcp migration execute` fences migration-route by patching this live CR
# (spec.gateway.fence.routes in kcp/gateway-migration.yaml), then applies
# gateway-switchover.yaml.
#
# Tokens substituted by configure_gateway_target.sh:
#   __OSS_BOOTSTRAP__          kafka.oss-workshop.internal:9092
#   __CC_BOOTSTRAP_SERVERS__   Confluent Cloud private bootstrap (host:port, no scheme)
---
apiVersion: platform.confluent.io/v1beta1
kind: Gateway
metadata:
  name: workshop-gateway
  namespace: confluent
spec:
  replicas: 2
  image:
    application: confluentinc/cpc-gateway:1.2.0-1-ubi9
    init: confluentinc/confluent-init-container:3.2.1
  secretStores:
    - name: vault-store
      provider:
        type: Vault
        configSecretRef: vault-config
  streamingDomains:
    - name: source-oss
      type: kafka
      kafkaCluster:
        bootstrapServers:
          - id: SCRAM
            endpoint: SASL_SSL://__OSS_BOOTSTRAP__
            tls:
              secretRef: oss-tls
        nodeIdRanges:
          - name: pool-1
            start: 1
            end: 1
    - name: confluent-cloud
      type: kafka
      kafkaCluster:
        bootstrapServers:
          - id: SASL_PLAIN
            endpoint: SASL_SSL://__CC_BOOTSTRAP_SERVERS__
            tls:
              secretRef: cc-tls
        nodeIdRanges:
          - name: pool-1
            start: 0
            end: 100
  routes:
    - name: migration-route
      endpoint: localhost:9595
      brokerIdentificationStrategy:
        type: port
      streamingDomain:
        name: source-oss
        bootstrapServerId: SCRAM
      security:
        auth: passthrough
    - name: scram-registration-route
      endpoint: localhost:9599
      brokerIdentificationStrategy:
        type: port
      streamingDomain:
        name: confluent-cloud
        bootstrapServerId: SASL_PLAIN
      security:
        auth: swap
        secretStore: vault-store
        client:
          authentication:
            type: scram
            scram:
              alterScramCredentials: true
              admin:
                secretRef: scram-admin-credentials
        cluster:
          authentication:
            type: plain
            jaasConfigPassThrough:
              secretRef: plain-jaas
  externalAccess:
    type: loadBalancer
    loadBalancer:
      domain: localhost
